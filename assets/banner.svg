<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" style="background:#080b10; border-radius:12px;">
  <defs>
    <!-- Background Gradient Blur -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0070f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ab47bc;stop-opacity:1" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;family=Inter:wght@400;600&amp;display=swap');
      .title {
        font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #00f2fe;
        letter-spacing: 3px;
      }
      .stars {
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Glowing Blurs -->
  <circle cx="150" cy="50" r="130" fill="url(#grad)" opacity="0.2" filter="blur(40px)" />
  <circle cx="680" cy="150" r="100" fill="#ab47bc" opacity="0.18" filter="blur(35px)" />

  <!-- Background Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    
    <line x1="100" y1="0" x2="100" y2="200" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="300" y1="0" x2="300" y2="200" />
    <line x1="400" y1="0" x2="400" y2="200" />
    <line x1="500" y1="0" x2="500" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
    <line x1="700" y1="0" x2="700" y2="200" />
  </g>

  <!-- Decorative Sparkles/Stars -->
  <g class="stars" opacity="0.3">
    <circle cx="70" cy="40" r="1.5" />
    <circle cx="720" cy="60" r="1.5" />
    <circle cx="580" cy="30" r="2" />
    <circle cx="190" cy="170" r="1" />
    <circle cx="340" cy="160" r="1.5" />
    <circle cx="480" cy="40" r="1" />
    <circle cx="620" cy="160" r="2" />
  </g>

  <!-- Content -->
  <text x="50%" y="95" text-anchor="middle" class="title">Hi, I'm Evan 👋</text>
  <text x="50%" y="135" text-anchor="middle" class="subtitle">FULL-STACK DEVELOPER &amp; AUTOMATION ENTHUSIAST</text>
</svg>
