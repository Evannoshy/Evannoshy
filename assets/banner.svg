<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" style="background:#b9d3e6; border-radius:12px;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;family=Inter:wght@600&amp;display=swap');
      .title {
        font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #1e293b;
      }
      .subtitle {
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #475569;
        letter-spacing: 3px;
      }
    </style>
  </defs>

  <!-- Background Grid Lines (Subtle light/dark overlay) -->
  <g stroke="rgba(30,41,59,0.06)" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    
    <line x1="100" y1="0" x2="100" y2="200" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="300" y1="0" x2="300" y2="200" />
    <line x1="400" y1="0" x2="400" y2="200" />
    <line x1="500" y1="0" x2="500" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
    <line x1="700" y1="0" x2="700" y2="200" />
  </g>

  <!-- Clean decorative dots on a light background -->
  <g fill="#475569" opacity="0.15">
    <circle cx="70" cy="40" r="1.5" />
    <circle cx="720" cy="60" r="1.5" />
    <circle cx="580" cy="30" r="2" />
    <circle cx="190" cy="170" r="1" />
    <circle cx="340" cy="160" r="1.5" />
    <circle cx="480" cy="40" r="1" />
    <circle cx="620" cy="160" r="2" />
  </g>

  <!-- Content (Centered) -->
  <text x="50%" y="95" text-anchor="middle" class="title">Hi, I'm Evan 👋</text>
  <text x="50%" y="135" text-anchor="middle" class="subtitle">FULL-STACK DEVELOPER &amp; AUTOMATION ENTHUSIAST</text>
</svg>
